<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — MedRescue</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/data.js"></script>
  <script src="js/firestore-service.js"></script>
  <script src="js/auth.js"></script>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="nav-logo">
      <span class="logo-mark" aria-hidden="true">
        <img src="assets/medrescue-logo.svg" alt="MedRescue logo" />
      </span>
      <span class="logo-text">MedRescue</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="login.html" class="active">Login</a></li>
    </ul>
  </nav>

  <div style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:2rem;">
    <div class="card" style="max-width:420px;width:100%;padding:2rem;">

      <div class="tabs" style="margin-bottom:1.5rem;">
        <button class="tab active" id="tabLogin" onclick="showTab('login')">Login</button>
        <button class="tab" id="tabSignup" onclick="showTab('signup')">Sign Up</button>
      </div>

      <div id="errorMsg" class="alert alert-danger" style="display:none;"></div>

      <!-- Login Form -->
      <div id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="your@email.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••">
        </div>
        <button class="btn btn-primary" style="width:100%;" onclick="doLogin()">Login</button>
      </div>

      <!-- Signup Form -->
      <div id="signupForm" style="display:none;">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="signupName" placeholder="John Doe">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="signupEmail" placeholder="your@email.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signupPassword" placeholder="•••••••• (min 6 chars)">
        </div>
        <div class="form-group">
          <label>I am a...</label>
          <select id="signupRole">
            <option value="patient">Patient</option>
            <option value="manager">Hospital Manager</option>
          </select>
        </div>
        <button class="btn btn-primary" style="width:100%;" onclick="doSignup()">Create Account</button>
      </div>

      <!-- Complete Profile -->
      <div id="completeProfileForm" style="display:none;">
        <p style="color:#6b7280;font-size:0.9rem;margin-bottom:1rem;">
          Your account exists but has no profile. Complete your details to continue.
        </p>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="compName" placeholder="John Doe">
        </div>
        <div class="form-group">
          <label>I am a...</label>
          <select id="compRole">
            <option value="patient">Patient</option>
            <option value="manager">Hospital Manager</option>
          </select>
        </div>
        <button class="btn btn-primary" style="width:100%;" onclick="completeProfile()">Save & Continue</button>
      </div>

      <div style="text-align:center;margin-top:1.5rem;">
        <a href="admin/lobby.html" style="font-size:0.85rem;color:#6b7280;text-decoration:none;">🛡️ Super Admin Access</a>
      </div>
    </div>
  </div>

  <script>
    Auth.init().then(user => {
      if (user && Auth.userProfile) {
        Auth.redirectToPanel(Auth.userProfile);
      }
      if (user && !Auth.userProfile) {
        showCompleteForm();
      }
    });

    function showTab(tab) {
      document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('signupForm').style.display = tab === 'signup' ? 'block' : 'none';
      document.getElementById('completeProfileForm').style.display = 'none';
      document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
      document.getElementById('tabSignup').classList.toggle('active', tab === 'signup');
      document.getElementById('errorMsg').style.display = 'none';
    }

    function showCompleteForm() {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('signupForm').style.display = 'none';
      document.getElementById('completeProfileForm').style.display = 'block';
      document.getElementById('tabLogin').classList.remove('active');
      document.getElementById('tabSignup').classList.remove('active');
      document.getElementById('errorMsg').style.display = 'none';
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = 'block';
    }

    async function doLogin() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      if (!email || !password) { showError('Please fill in all fields'); return; }
      try {
        const profile = await Auth.login(email, password);
        if (!profile) {
          showCompleteForm();
          return;
        }
        Auth.redirectToPanel(profile);
      } catch (e) {
        showError(e.message);
      }
    }

    async function completeProfile() {
      const name = document.getElementById('compName').value;
      const role = document.getElementById('compRole').value;
      if (!name) { showError('Please enter your name'); return; }
      const user = Auth.currentUser;
      if (!user) { showError('Session expired. Please login again.'); return; }
      const profile = {
        uid: user.uid, name, email: user.email, role,
        createdAt: new Date().toISOString()
      };
      if (role === 'patient') {
        profile.patientId = 'P-' + Date.now().toString(36).toUpperCase();
        Auth.ensurePatientRecord(profile);
      }
      if (role === 'manager') profile.status = 'pending';
      Auth.saveLocal(profile);
      try {
        if (typeof db !== 'undefined') await db.collection('users').doc(user.uid).set(profile);
      } catch(e) {}
      Auth.userProfile = profile;
      Auth.redirectToPanel(profile);
    }

    async function doSignup() {
      const name = document.getElementById('signupName').value;
      const email = document.getElementById('signupEmail').value;
      const password = document.getElementById('signupPassword').value;
      const role = document.getElementById('signupRole').value;
      if (!name || !email || !password) { showError('Please fill in all fields'); return; }
      if (password.length < 6) { showError('Password must be at least 6 characters'); return; }
      try {
        const profile = await Auth.signup(email, password, name, role);
        Auth.redirectToPanel(profile);
      } catch (e) {
        showError(e.message);
      }
    }

    document.getElementById('loginEmail').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    document.getElementById('loginPassword').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  </script>

</body>
</html>
